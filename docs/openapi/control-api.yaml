openapi: 3.1.0
info:
  title: FlagForge Control API
  version: 1.0.0
  description: |
    Operator contract for tenant resources. Identity comes from an OIDC-issued bearer token; the
    organization is selected per request and is trusted only after an ACTIVE membership is found
    for that actor. Organization identifiers are never accepted from a request body.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/organizations:
    post:
      operationId: registerOrganization
      summary: Register an organization and become its founding OWNER
      description: |
        The only operation that needs no organization context. The founding actor is taken from the
        token subject, so a caller cannot found an organization owned by somebody else; any actor
        field in the body is ignored.
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOrganizationRequest'
            examples:
              acme:
                value:
                  slug: acme
                  displayName: Acme
      responses:
        '201':
          description: Organization registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/InvalidTenantRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/v1/organizations/current:
    get:
      operationId: getCurrentOrganization
      summary: Read the organization selected by the request
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      responses:
        '200':
          description: Current organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /api/v1/projects:
    post:
      operationId: createProject
      summary: Create a project
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/InvalidTenantRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
  /api/v1/projects/{projectId}:
    get:
      operationId: getProject
      summary: Read one project
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /api/v1/projects/{projectId}/environments:
    post:
      operationId: createEnvironment
      summary: Create an environment inside a project
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentRequest'
      responses:
        '201':
          description: Environment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          $ref: '#/components/responses/InvalidTenantRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /api/v1/environments/{environmentId}:
    get:
      operationId: getEnvironment
      summary: Read one environment
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /api/v1/memberships:
    post:
      operationId: addMembership
      summary: Add a member to the caller's organization
      description: |
        The organization comes from the authenticated request, never from the body. Granting OWNER
        requires ORGANIZATION_MANAGE; every other role requires MEMBERSHIP_MANAGE.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRequest'
      responses:
        '201':
          description: Membership created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/InvalidTenantRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
  /api/v1/memberships/role:
    put:
      operationId: changeMembershipRole
      summary: Change a member's role
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRequest'
      responses:
        '200':
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          description: The change would leave the organization without an active OWNER.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/projects/{projectId}/flags:
    post:
      operationId: createFeatureFlag
      summary: Create a typed feature flag with its variants
      description: |
        The declared `valueType` decides which variant field is read, so a value is never coerced
        between types. Only BOOLEAN and STRING are supported; NUMBER and JSON are reserved and
        rejected with `UNSUPPORTED_VALUE_TYPE`.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFlagRequest'
            examples:
              booleanFlag:
                value:
                  key: checkout-v2
                  displayName: Checkout v2
                  ownerId: squad-checkout
                  valueType: BOOLEAN
                  lifecycleType: OPERATIONAL
                  defaultVariantKey: enabled
                  variants:
                    - key: disabled
                      booleanValue: false
                    - key: enabled
                      booleanValue: true
      responses:
        '201':
          description: Flag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
        '400':
          $ref: '#/components/responses/InvalidFlagRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          description: A flag with that key already exists in the project.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/projects/{projectId}/flags/{flagId}:
    get:
      operationId: getFeatureFlag
      summary: Read one feature flag
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/FlagId'
      responses:
        '200':
          description: Feature flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    delete:
      operationId: archiveFeatureFlag
      summary: Archive a feature flag
      description: |
        Archiving preserves metadata and variants for history and removes the flag from the active
        lookup path. The key cannot be reused afterwards.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/FlagId'
      responses:
        '200':
          description: Flag archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /api/v1/environments/{environmentId}/sdk-credentials:
    post:
      operationId: createSdkCredential
      summary: Issue an environment-scoped SDK credential
      description: |
        The plaintext is returned here and never again; only a hash is stored. A caller that loses
        it must rotate rather than read it back.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/EnvironmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
      responses:
        '201':
          description: Credential issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedCredential'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    get:
      operationId: listSdkCredentials
      summary: List credential metadata for an environment
      description: Metadata only. The secret is never returned by this operation.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/EnvironmentId'
      responses:
        '200':
          description: Credential metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialMetadata'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /api/v1/sdk-credentials/{credentialId}/rotation:
    post:
      operationId: rotateSdkCredential
      summary: Rotate a credential
      description: |
        Creates a replacement linked to its predecessor and revokes the predecessor in one
        transaction, so the two never authorize at the same time.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/CredentialId'
      responses:
        '200':
          description: Credential rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedCredential'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/CredentialStateConflict'
  /api/v1/sdk-credentials/{credentialId}/revocation:
    post:
      operationId: revokeSdkCredential
      summary: Revoke a credential
      description: Revocation takes effect immediately for subsequent evaluation requests.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/CredentialId'
      responses:
        '200':
          description: Credential revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMetadata'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/CredentialStateConflict'
components:
  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC-issued token whose subject identifies the operator.
  parameters:
    OrganizationHeader:
      name: X-FlagForge-Organization
      in: header
      required: true
      description: |
        Organization slug the request acts in. Accepted only when the authenticated actor holds an
        ACTIVE membership in it; otherwise the request is treated as unauthenticated, so an
        unknown organization and one the caller does not belong to cannot be told apart.
      schema:
        type: string
        pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FlagId:
      name: flagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AuthenticationRequired:
      description: |
        No usable identity. A missing token, a malformed or expired token, an unknown organization,
        and a missing membership all produce this one response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    AccessDenied:
      description: The actor is authenticated in this organization but its role lacks the permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ResourceNotFound:
      description: |
        The resource does not exist, or belongs to another organization. Both cases return this
        response so resource existence cannot be probed across tenants.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InvalidTenantRequest:
      description: The request body is malformed, or a slug or key is already taken.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InvalidFlagRequest:
      description: |
        The flag request is malformed. `errorCode` carries the domain validation code, such as
        `INVALID_TEXT` for a missing required field, `TYPE_MISMATCH` for a variant whose value
        contradicts the declared type, or `UNSUPPORTED_VALUE_TYPE` for a reserved type.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    CredentialStateConflict:
      description: The credential is revoked, or changed concurrently.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    RegisterOrganizationRequest:
      type: object
      required: [slug, displayName]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
        displayName:
          type: string
          maxLength: 120
    CreateProjectRequest:
      type: object
      required: [key, displayName]
      properties:
        key:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
        displayName:
          type: string
          maxLength: 120
    CreateEnvironmentRequest:
      type: object
      required: [key, displayName]
      properties:
        key:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
        displayName:
          type: string
          maxLength: 120
    Organization:
      type: object
      required: [id, slug, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    Project:
      type: object
      required: [id, key, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    Environment:
      type: object
      required: [id, projectId, key, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        key:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    MembershipRequest:
      type: object
      required: [actorId]
      properties:
        actorId:
          type: string
          maxLength: 128
        role:
          type: string
          enum: [OWNER, ADMIN, DEVELOPER, VIEWER]
          description: Defaults to VIEWER when omitted on creation; required when changing a role.
    Membership:
      type: object
      required: [id, actorId, role, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
        role:
          type: string
          enum: [OWNER, ADMIN, DEVELOPER, VIEWER]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        createdAt:
          type: string
          format: date-time
    CreateFlagRequest:
      type: object
      required: [key, displayName, ownerId, valueType, lifecycleType, defaultVariantKey, variants]
      properties:
        key:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
        displayName:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 500
        ownerId:
          type: string
          maxLength: 128
        valueType:
          type: string
          enum: [BOOLEAN, STRING, NUMBER, JSON]
          description: NUMBER and JSON are reserved and rejected until fully implemented.
        lifecycleType:
          type: string
          enum: [RELEASE, EXPERIMENT, OPERATIONAL, KILL_SWITCH]
        expectedRemovalDate:
          type: string
          format: date
          description: Required for RELEASE and EXPERIMENT flags.
        defaultVariantKey:
          type: string
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VariantRequest'
    VariantRequest:
      type: object
      required: [key]
      description: |
        Exactly one value field is read, chosen by the flag's declared valueType — booleanValue for
        BOOLEAN, stringValue for STRING. Supplying the wrong one is a TYPE_MISMATCH.
      properties:
        key:
          type: string
        booleanValue:
          type: boolean
        stringValue:
          type: string
    FeatureFlag:
      type: object
      required: [id, projectId, key, displayName, valueType, lifecycleType, defaultVariantKey, state, variants]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        key:
          type: string
        displayName:
          type: string
        valueType:
          type: string
          enum: [BOOLEAN, STRING, NUMBER, JSON]
        lifecycleType:
          type: string
          enum: [RELEASE, EXPERIMENT, OPERATIONAL, KILL_SWITCH]
        defaultVariantKey:
          type: string
        state:
          type: string
          enum: [ACTIVE, ARCHIVED]
        variants:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              valueType:
                type: string
              value: {}
    CreateCredentialRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    CredentialMetadata:
      type: object
      required: [id, environmentId, name, keyPrefix, scope, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
        name:
          type: string
        keyPrefix:
          type: string
          description: Public lookup identifier. Not secret, and not sufficient to authenticate.
        scope:
          type: string
          enum: [EVALUATE]
        status:
          type: string
          enum: [ACTIVE, REVOKED]
        rotatedFromId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    IssuedCredential:
      type: object
      required: [credential, plaintext]
      properties:
        credential:
          $ref: '#/components/schemas/CredentialMetadata'
        plaintext:
          type: string
          description: |
            Returned only here, on creation and rotation. Only a SHA-256 hash of the random secret
            is stored, so this value cannot be recovered later.
    ProblemDetail:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errorCode:
          type: string
        correlationId:
          type: string
